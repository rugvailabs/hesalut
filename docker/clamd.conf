# clamd configuration for hesalut.
#
# Based on the clamav/clamav image default, with one change that matters:
# StreamMaxLength must be at least as large as MAX_UPLOAD_BYTES (100 MB) or
# clamd rejects large INSTREAM scans with "size limit exceeded" and the upload
# endpoint fails closed on files that are merely big, not malicious.

LogTime yes
LogClean no
LogVerbose no
LogSyslog no

# Listen on TCP so the backend and Celery workers can reach it across the
# compose network, and on the local socket for clamdcheck.sh (healthcheck).
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock

DatabaseDirectory /var/lib/clamav
Foreground yes

User clamav

MaxThreads 4
MaxScanSize 200M
MaxFileSize 150M
StreamMaxLength 150M

# Refuse to start rather than run without signatures.
ExitOnOOM yes
